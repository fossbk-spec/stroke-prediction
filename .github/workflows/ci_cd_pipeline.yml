name: CI - Lint, Test & Zero-Leakage Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Check syntax / imports
        run: ruff check src tests scripts
      - name: Check formatting
        run: ruff format --check src tests scripts
        continue-on-error: true

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the full test suite
        run: python -m pytest -v

  zero-leakage-audit:
    name: Zero Data Leakage audit (required gate)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Quality gate: every data-leakage test MUST pass, otherwise -> block the merge.
      - name: Check the patient-level split & fit-on-train-only discipline
        run: python -m pytest tests/test_data_leakage.py -v

      - name: Run the end-to-end pipeline on synthetic data
        run: python -m src.train --synthetic --models logistic_regression random_forest --no-cv

      - name: Run EDA end-to-end on synthetic data
        run: python scripts/run_eda.py --synthetic
