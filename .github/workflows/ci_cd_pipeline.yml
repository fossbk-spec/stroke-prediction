name: CI - Lint, Test & Zero-Leakage Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cai dat ruff
        run: pip install ruff
      - name: Kiem tra loi cu phap / import
        run: ruff check src tests scripts
      - name: Kiem tra dinh dang
        run: ruff format --check src tests scripts
        continue-on-error: true

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cai dat phu thuoc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Chay toan bo test suite
        run: python -m pytest -v

  zero-leakage-audit:
    name: Zero Data Leakage audit (cong bat buoc)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cai dat phu thuoc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cong chat luong: moi test ve ro ri du lieu PHAI pass, neu khong -> chan merge.
      - name: Kiem tra ky luat patient-level split & fit-on-train-only
        run: python -m pytest tests/test_data_leakage.py -v

      - name: Chay pipeline end-to-end tren du lieu gia lap
        run: python -m src.train --synthetic --models logistic_regression random_forest --no-cv

      - name: Chay EDA end-to-end tren du lieu gia lap
        run: python scripts/run_eda.py --synthetic
