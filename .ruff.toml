line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # do dai dong da duoc formatter xu ly
    "B008",   # goi ham trong gia tri mac dinh (pho bien voi sklearn)
]

[lint.per-file-ignores]
"tests/*" = ["E402"]        # conftest can sua sys.path truoc khi import
"scripts/*" = ["E402"]
"notebooks/*" = ["E402"]
