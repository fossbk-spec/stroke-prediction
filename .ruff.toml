line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in a default argument (common with sklearn)
]

[lint.per-file-ignores]
"tests/*" = ["E402"]        # conftest needs to patch sys.path before importing
"scripts/*" = ["E402"]
"notebooks/*" = ["E402"]
